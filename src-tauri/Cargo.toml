[package]
name = "signalx"
version = "0.1.0"
description = "SignalX headless Signal backend"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dotenv = "0.15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "signal", "macros"] }
chrono = { version = "0.4", features = ["clock"] }
dirs-next = "2"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4", "serde"] }
ureq = { version = "2", features = ["json"] }
